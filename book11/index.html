<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الكتاب الحادي عشر - Book 11 Quiz</title>
    <style>
        :root {
            --burgundy: #800020;
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
            --correct-color: #38a169;
            --incorrect-color: #e53e3e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--burgundy);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--burgundy);
            font-size: 26px;
            margin-bottom: 8px;
        }

        .header p {
            color: #718096;
            font-size: 16px;
            font-weight: 600;
        }

        .question-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-right: 5px solid var(--burgundy);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .question-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            direction: ltr;
            text-align: left;
        }

        .options-list {
            list-style: none;
            direction: ltr;
            text-align: left;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-item label {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-item label:hover {
            background-color: #edf2f7;
        }

        .option-item input[type="radio"] {
            margin-right: 12px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--burgundy);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        #result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* Footer المعدل باللون العنابي */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 14px;
            color: var(--burgundy);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>BOOK 11 - ALC PRACTICE QUIZ</h1>
        <p>American Language Course Preparation Guide</p>
    </div>

    <form id="quizForm">
        <!-- Question 1 -->
        <div class="question-card">
            <div class="question-title">1. Select the correct structure:</div>
            <ul class="options-list">
                <li class="option-item">
                    <label><input type="radio" name="q1" value="a"> a) He insisted on finishing the report.</label>
                </li>
                <li class="option-item">
                    <label><input type="radio" name="q1" value="b"> b) He insisted to finish the report.</label>
                </li>
                <li class="option-item">
                    <label><input type="radio" name="q1" value="c"> c) He insisted for finishing the report.</label>
                </li>
            </ul>
        </div>

        <!-- Question 2 -->
        <div class="question-card">
            <div class="question-title">2. Choose the best response:</div>
            <ul class="options-list">
                <li class="option-item">
                    <label><input type="radio" name="q2" value="a"> a) The weather was so cold that we stayed inside.</label>
                </li>
                <li class="option-item">
                    <label><input type="radio" name="q2" value="b"> b) The weather was such cold that we stayed inside.</label>
                </li>
                <li class="option-item">
                    <label><input type="radio" name="q2" value="c"> c) The weather was too cold that we stayed inside.</label>
                </li>
            </ul>
        </div>

        <button type="button" class="btn-submit" onclick="calculateScore()">إرسال الإجابات والتقييم</button>
    </form>

    <div id="result-box"></div>

    <div class="footer">
        DLI ALC Prep Guide — Book 11 Quiz | All Rights Reserved
    </div>
</div>

<script>
    function calculateScore() {
        const answers = {
            q1: 'a',
            q2: 'a'
        };

        let score = 0;
        let total = Object.keys(answers).length;

        for (let key in answers) {
            let selected = document.querySelector(⁠ input[name="${key}"]:checked ⁠);
            if (selected && selected.value === answers[key]) {
                score++;
            }
        }

        let resultBox = document.getElementById('result-box');
        resultBox.style.display = 'block';
        
        let percentage = (score / total) * 100;
        if (percentage >= 70) {
            resultBox.style.backgroundColor = '#c6f6d5';
            resultBox.style.color = '#22543d';
            resultBox.innerHTML = ⁠ أحسنت! درجتك هي: ${score} من ${total} (${percentage}%) ⁠;
        } else {
            resultBox.style.backgroundColor = '#fed7d7';
            resultBox.style.color = '#742a2a';
            resultBox.innerHTML = ⁠ حاول مرة أخرى. درجتك هي: ${score} من ${total} (${percentage}%) ⁠;
        }
    }
</script>

</body>
</html>
