<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبارات الكتاب الحادي عشر - Book 11 Quiz</title>
    <style>
        :root {
            --burgundy: #800020;
            --dark-gray: #333333;
            --light-bg: #f9f9f9;
            --border-color: #e0e0e0;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: var(--dark-gray);
            margin: 0;
            padding: 20px;
            background-color: #fff;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
            padding: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--burgundy);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--burgundy);
            margin: 0 0 5px 0;
            font-size: 24px;
        }

        .header p {
            margin: 0;
            color: #666;
            font-weight: bold;
        }

        .question-card {
            background-color: var(--light-bg);
            border-right: 4px solid var(--burgundy);
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 2px;
        }

        .question-text {
            font-weight: bold;
            margin-bottom: 10px;
            direction: ltr;
            text-align: left;
        }

        .options {
            list-style: none;
            padding: 0;
            margin: 0;
            direction: ltr;
            text-align: left;
        }

        .options li {
            padding: 5px 0;
        }

        /* Footer styling with burgundy text color */
        .footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 14px;
            color: var(--burgundy);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>BOOK 11 - QUIZES & TESTS</h1>
            <p>American Language Course (ALC) - DLI Summary</p>
        </div>

        <!-- نماذج أسئلة الكتاب 11 -->
        <div class="question-card">
            <div class="question-text">1. Select the correct sentence:</div>
            <ul class="options">
                <li>a) He enjoys to study English.</li>
                <li>b) He enjoys studying English.</li>
                <li>c) He enjoy studying English.</li>
            </ul>
        </div>

        <!-- Footer -->
        <div class="footer">
            DLI ALC Prep Guide — Book 11 | All Rights Reserved
        </div>
    </div>

</body>
</html>
