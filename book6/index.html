    let currentTest = 0, currentQ = 0, answers = [], answered = [];

    function startTest(idx) {
      currentTest = idx;
      currentQ = 0;
      const qCount = TESTS[idx].questions.length;
      answers = new Array(qCount).fill(null);
      answered = new Array(qCount).fill(false);
      document.getElementById('selector').style.display = 'none';
      document.getElementById('results').style.display = 'none';
      document.getElementById('quiz').style.display = 'block';
      document.getElementById('quizTitle').textContent = ⁠ Book 6 — ${TESTS[idx].title} ⁠;
      renderQ();
    }

    function renderQ() {
      const qData = TESTS[currentTest].questions[currentQ];
      const total = TESTS[currentTest].questions.length;
      document.getElementById('quizSub').textContent = ⁠ Q${currentQ + 1} of ${total} ⁠;
      document.getElementById('qMeta').textContent = ⁠ Question ${currentQ + 1} ⁠;
      document.getElementById('qText').textContent = qData.q;
      document.getElementById('progressBar').style.width = ⁠ ${((currentQ + 1) / total) * 100}% ⁠;
      const opts = [
        { key: 'a', text: qData.a },
        { key: 'b', text: qData.b },
        { key: 'c', text: qData.c },
        { key: 'd', text: qData.d }
      ];
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        if (answered[currentQ]) {
          btn.disabled = true;
          if (opt.key === qData.ans) btn.classList.add('correct');
          else if (answers[currentQ] === opt.key) btn.classList.add('wrong');
        } else {
          btn.onclick = () => selectAnswer(opt.key);
        }
        btn.innerHTML = ⁠ <span class="opt-letter">${opt.key.toUpperCase()}</span><span>${opt.text}</span> ⁠;
        container.appendChild(btn);
      });
      document.getElementById('prevBtn').disabled = currentQ === 0;
      document.getElementById('nextBtn').textContent = currentQ === total - 1 ? 'Finish →' : 'Next →';
    }

    function selectAnswer(letter) {
      if (answered[currentQ]) return;
      answers[currentQ] = letter;
      answered[currentQ] = true;
      renderQ();
    }

    function nextQ() {
      const total = TESTS[currentTest].questions.length;
      if (!answered[currentQ]) {
        alert('Please select an answer before moving forward.');
        return;
      }
      if (currentQ < total - 1) {
        currentQ++;
        renderQ();
      } else {
        showResults();
      }
    }

    function prevQ() {
      if (currentQ > 0) {
        currentQ--;
        renderQ();
      }
    }

    function showResults() {
      document.getElementById('quiz').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      const qList = TESTS[currentTest].questions;
      let score = 0;
      const wrongs = [];
      qList.forEach((q, i) => {
        if (answers[i] === q.ans) score++;
        else wrongs.push({ idx: i + 1, q: q.q, userAns: answers[i], correctAns: q.ans, correctText: q[q.ans] });
      });
      const pass = score >= 24;
      document.getElementById('resultScore').textContent = score;
      const badge = document.getElementById('resultBadge');
      badge.textContent = pass ? 'PASSED' : 'NOT PASSED';
      badge.className = ⁠ result-badge ${pass ? 'pass' : 'fail'} ⁠;
      document.getElementById('resultMsg').textContent = pass
        ? 'Excellent! You reached the passing score for Book 6.'
        : 'Keep practicing! Review your mistakes below and try again.';
      document.getElementById('resultEmoji').textContent = pass ? '🎉' : '📚';
      const rList = document.getElementById('reviewList');
      if (wrongs.length === 0) {
        rList.innerHTML = '<h3>Review</h3><p style="color:var(--green);font-size:14px;">Perfect score! No mistakes.</p>';
      } else {
        rList.innerHTML = ⁠ <h3>Mistakes to Review (${wrongs.length})</h3> ⁠ +
          wrongs.map(w => `
            <div class="review-item">
              <span class="review-icon">❌</span>
              <div class="review-q"><b>Q${w.idx}:</b> ${w.q}<br>
                <span class="review-ans wrong">Your answer: ${w.userAns ? w.userAns.toUpperCase() : 'None'}</span> | 
                <span class="review-ans correct">Correct: ${w.correctAns.toUpperCase()} (${w.correctText})</span>
              </div>
            </div>
          `).join('');
      }
    }

    function retryTest() { startTest(currentTest); }
    function backToSelector() {
      document.getElementById('selector').style.display = 'block';
      document.getElementById('quiz').style.display = 'none';
      document.getElementById('results').style.display = 'none';
    }
