<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hit the 60s — Book 1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root {
    --navy: #1F3864;
    --blue: #2E75B6;
    --red: #C00000;
    --green: #00B050;
    --gold: #F4A800;
    --bg: #F0F4FA;
    --card: #FFFFFF;
    --text: #1a1a2e;
    --muted: #6B7280;
    --border: #E2E8F0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--navy);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-badge {
    background: var(--gold);
    color: var(--navy);
    font-weight: 800;
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }
  header h1 {
    color: #fff;
    font-size: 18px;
    font-weight: 700;
  }
  header span {
    color: #94A3B8;
    font-size: 13px;
    margin-left: auto;
  }

  /* ── MAIN CONTAINER ── */
  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* ── TEST SELECTOR ── */
  #selector {
    text-align: center;
    padding: 40px 20px;
  }
  #selector h2 {
    font-size: 26px;
    font-weight: 800;
    color: var(--navy);
    margin-bottom: 6px;
  }
  #selector p {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 32px;
  }
  .test-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    max-width: 400px;
    margin: 0 auto;
  }
  .test-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 18px 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .test-btn:hover {
    border-color: var(--blue);
    background: #EEF4FF;
    transform: translateY(-2px);
  }
  .test-btn .num {
    font-size: 24px;
    font-weight: 800;
    color: var(--navy);
  }
  .test-btn .lbl {
    font-size: 10px;
    color: var(--muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .test-btn.done {
    border-color: var(--green);
    background: #F0FDF4;
  }
  .test-btn.done .num { color: var(--green); }

  /* ── QUIZ SCREEN ── */
  #quiz { display: none; }

  .quiz-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .back-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--blue);
    font-size: 14px;
    font-weight: 600;
    padding: 6px 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .quiz-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--navy);
  }
  .quiz-sub {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    background: var(--border);
    border-radius: 99px;
    height: 6px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), var(--navy));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* ── QUESTION CARD ── */
  .q-card {
    background: var(--card);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    margin-bottom: 16px;
  }
  .q-num {
    font-size: 11px;
    font-weight: 700;
    color: var(--blue);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .q-text {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 24px;
  }

  /* ── CHOICES ── */
  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .choice {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.18s;
    background: #FAFBFC;
  }
  .choice:hover:not(.locked) {
    border-color: var(--blue);
    background: #EEF4FF;
  }
  .choice-letter {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: var(--muted);
    flex-shrink: 0;
    transition: all 0.18s;
  }
  .choice-text {
    font-size: 15px;
    color: var(--text);
    flex: 1;
  }
  .choice.selected {
    border-color: var(--blue);
    background: #EEF4FF;
  }
  .choice.selected .choice-letter {
    background: var(--blue);
    color: #fff;
  }
  .choice.correct {
    border-color: var(--green);
    background: #F0FDF4;
  }
  .choice.correct .choice-letter {
    background: var(--green);
    color: #fff;
  }
  .choice.wrong {
    border-color: var(--red);
    background: #FFF0F0;
  }
  .choice.wrong .choice-letter {
    background: var(--red);
    color: #fff;
  }
  .choice.locked { cursor: default; }

  /* ── FEEDBACK ── */
  .feedback {
    display: none;
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
  }
  .feedback.correct-fb {
    background: #F0FDF4;
    color: var(--green);
    border: 1px solid #BBF7D0;
    display: block;
  }
  .feedback.wrong-fb {
    background: #FFF0F0;
    color: var(--red);
    border: 1px solid #FECACA;
    display: block;
  }

  /* ── NAV BUTTONS ── */
  .nav-row {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .nav-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
  }
  .nav-btn.primary {
    background: var(--navy);
    color: #fff;
  }
  .nav-btn.primary:hover { background: var(--blue); }
  .nav-btn.secondary {
    background: var(--border);
    color: var(--muted);
  }
  .nav-btn.secondary:hover { background: #D1D5DB; color: var(--text); }
  .nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* ── RESULTS SCREEN ── */
  #results { display: none; }

  .result-card {
    background: var(--card);
    border-radius: 20px;
    padding: 36px 24px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }
  .result-emoji {
    font-size: 60px;
    margin-bottom: 16px;
    display: block;
  }
  .result-score {
    font-size: 56px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
  }
  .result-score.pass { color: var(--green); }
  .result-score.fail { color: var(--red); }
  .result-label {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .result-badge {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 99px;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 20px;
  }
  .result-badge.pass { background: #F0FDF4; color: var(--green); }
  .result-badge.fail { background: #FFF0F0; color: var(--red); }
  .result-msg {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
  }

  .review-list {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .review-list h3 {
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .review-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .review-item:last-child { border-bottom: none; }
  .review-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .review-q { font-size: 13px; color: var(--text); flex: 1; }
  .review-ans { font-size: 12px; font-weight: 600; }
  .review-ans.correct { color: var(--green); }
  .review-ans.wrong { color: var(--red); }

  .result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .action-btn {
    padding: 15px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
  }
  .action-btn.primary { background: var(--navy); color: #fff; }
  .action-btn.primary:hover { background: var(--blue); }
  .action-btn.outline {
    background: none;
    border: 2px solid var(--border);
    color: var(--muted);
  }
  .action-btn.outline:hover { border-color: var(--blue); color: var(--blue); }

  /* ── FOOTER ── */
  .page-footer {
    text-align: center;
    margin-top: 40px;
  }
</style>
</head>

let currentTest = 0;
let currentQ = 0;
let answers = [];
let answered = [];

function startTest(idx) {
  currentTest = idx;
  currentQ = 0;
  answers = new Array(30).fill(null);
  answered = new Array(30).fill(false);
  document.getElementById('selector').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  document.getElementById('quizTitle').textContent = ⁠ Book 1 — ${TESTS[idx].title} ⁠;
  document.getElementById('quizSub').textContent = 'Pass: 24/30';
  renderQ();
}

function renderQ() {
  const test = TESTS[currentTest];
  const q = test.questions[currentQ];
  const total = test.questions.length;

  document.getElementById('qNum').textContent = ⁠ Question ${currentQ + 1} of ${total} ⁠;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('progressFill').style.width = ⁠ ${((currentQ + 1) / total) * 100}% ⁠;

  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = '';

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.ch.forEach((choice, i) => {
    const letter = ['A','B','C','D'][i];
    const div = document.createElement('div');
    div.className = 'choice';
    if (answered[currentQ]) div.classList.add('locked');

    const userAns = answers[currentQ];
    if (answered[currentQ]) {
      if (letter === q.a) div.classList.add('correct');
      else if (letter === userAns && userAns !== q.a) div.classList.add('wrong');
    } else if (userAns === letter) {
      div.classList.add('selected');
    }

    div.innerHTML = ⁠ <div class="choice-letter">${letter}</div><div class="choice-text">${choice.substring(3)}</div> ⁠;
    if (!answered[currentQ]) {
      div.onclick = () => selectAnswer(letter);
    }
    choicesEl.appendChild(div);
  });

  if (answered[currentQ]) {
    const correct = answers[currentQ] === q.a;
    fb.className = 'feedback ' + (correct ? 'correct-fb' : 'wrong-fb');
    fb.textContent = correct ? '✓ Correct!' : ⁠ ✗ Wrong. The correct answer is ${q.a}. ⁠;
  }

  document.getElementById('prevBtn').disabled = currentQ === 0;
  const nextBtn = document.getElementById('nextBtn');
  if (currentQ === TESTS[currentTest].questions.length - 1) {
    nextBtn.textContent = 'Finish ✓';
  } else {
    nextBtn.textContent = 'Next →';
  }
}

function selectAnswer(letter) {
  if (answered[currentQ]) return;
  answers[currentQ] = letter;
  answered[currentQ] = true;
  renderQ();
}

function nextQ() {
  if (!answered[currentQ]) {
    alert('Please choose an answer first.');
    return;
  }
  if (currentQ < TESTS[currentTest].questions.length - 1) {
    currentQ++;
    renderQ();
  } else {
    showResults();
  }
}

function prevQ() {
  if (currentQ > 0) {
    currentQ--;
    renderQ();
  }
}

function showResults() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'block';

  const test = TESTS[currentTest];
  let score = 0;
  answers.forEach((a, i) => { if (a === test.questions[i].a) score++; });

  const pass = score >= 24;
  document.getElementById('resultEmoji').textContent = pass ? '🎯' : '📚';
  document.getElementById('resultScore').textContent = ⁠ ${score}/30 ⁠;
  document.getElementById('resultScore').className = ⁠ result-score ${pass ? 'pass' : 'fail'} ⁠;

  const badge = document.getElementById('resultBadge');
  badge.textContent = pass ? '✅ PASSED' : '❌ NOT PASSED';
  badge.className = ⁠ result-badge ${pass ? 'pass' : 'fail'} ⁠;

  document.getElementById('resultMsg').textContent = pass
    ? ⁠ Excellent! You scored ${score} out of 30. Keep it up! ⁠
    : ⁠ You scored ${score} out of 30. You need 24 to pass. Review your mistakes and try again! ⁠;

  // Review wrong answers
  const reviewList = document.getElementById('reviewList');
  const wrongs = answers.map((a,i) => ({i, a, correct: a === test.questions[i].a, q: test.questions[i]}))
                        .filter(x => !x.correct);

  if (wrongs.length === 0) {
    reviewList.innerHTML = '<h3>Review</h3><p style="color:var(--green);font-size:14px;padding:10px 0">🎉 Perfect score! No mistakes.</p>';
  } else {
    reviewList.innerHTML = ⁠ <h3>Mistakes to Review (${wrongs.length})</h3> ⁠ +
      wrongs.map(w => `
        <div class="review-item">
          <span class="review-icon">❌</span>
          <div class="review-q">Q${w.i+1}: ${w.q.q}</div>
          <div class="review-ans wrong">You: ${w.a || '—'} | Correct: <span class="correct">${w.q.a}</span></div>
        </div>
      `).join('');
  }
}

function retryTest() {
  startTest(currentTest);
}

function backToSelector() {
  document.getElementById('selector').style.display = 'block';
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'none';
}
